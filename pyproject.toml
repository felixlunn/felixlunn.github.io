[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whips"
version = "0.1.0"
description = "Constituency analytics for MPs' offices: census, policing and election data with twin-seat, index and profile-matching tools."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "requests>=2.31",
    "shapely>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools.packages.find]
include = ["whips*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
