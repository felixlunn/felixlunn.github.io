[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datadash"
version = "0.1.0"
description = "Constituency analytics for MPs' offices: census, local services and election data by seat, plus FOI research maps."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "pyproj>=3.6",
    "requests>=2.31",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["datadash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
