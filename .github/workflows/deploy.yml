name: Refresh data & deploy

# Rebuilds every dataset from the live APIs and publishes the dashboard to
# GitHub Pages. Runs daily, on every push to main, and on demand. Monday's run (and a manual run with
# "fresh" ticked) ignores saved copies and re-downloads every source.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC every day
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip:
        description: "Optional sources to skip, space-separated (foi council_control scotland fire police_workforce heat_pumps green_space floods business_demography council_tax insolvency university ofsted pupils pharmacies public_health income asylum road_condition rents energy travel renewables air_pollution children vehicles buses cqc roads housing_stock child_poverty dental life_expectancy affordability homelessness ev sewage petitions questions rail courts fuel_poverty nhs schools epc imd neighbourhoods debates claimants aps ashe bres business popest police elections members lsoa)"
        required: false
        default: ""
      fresh:
        description: "Re-download every source, ignoring saved copies"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write # to raise an alert when the refresh or a data source fails

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # Census 2021 never changes: keep fetched tables between runs (each run saves a fresh
      # copy; tables are refetched only when a metric needs categories the cache lacks).
      - name: Restore census cache
        uses: actions/cache@v4
        with:
          path: .cache/census
          key: census-v1-${{ github.run_id }}
          restore-keys: census-v1-

      # Slow sources that change rarely (police.uk, EPC, NHS, ...) are reused for a few days; see whips/cache.py.
      - name: Restore saved sources
        uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-v1-${{ github.run_id }}
          restore-keys: sources-v1-

      # The data now on the live site: used to tell how long each source's figures have gone unchanged.
      - name: Fetch the published data
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          [ "${GITHUB_REPOSITORY#*/}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ] || SITE="$SITE/${GITHUB_REPOSITORY#*/}"
          curl -sfL --max-time 60 "$SITE/data/data.json" -o previous.json || rm -f previous.json

      - name: Fetch data and compute metrics
        env:
          WHIPS_CENSUS_CACHE: .cache/census
          WHIPS_PREVIOUS_DATA: previous.json
          FRESH_INPUT: ${{ github.event.inputs.fresh }}
          NOMIS_UID: ${{ secrets.NOMIS_UID }} # optional Nomis API key (higher limits)
          EPC_TOKEN: ${{ secrets.EPC_TOKEN }} # EPC API bearer token (get-energy-performance-data.communities.gov.uk)
          SKIP_INPUT: ${{ github.event.inputs.skip }}
        run: |
          SKIP=""
          for s in $SKIP_INPUT; do
            case "$s" in foi|council_control|scotland|fire|police_workforce|heat_pumps|green_space|floods|business_demography|council_tax|insolvency|university|ofsted|pupils|pharmacies|public_health|income|asylum|road_condition|rents|energy|travel|renewables|air_pollution|children|vehicles|buses|cqc|roads|housing_stock|child_poverty|dental|life_expectancy|affordability|homelessness|ev|sewage|petitions|questions|rail|courts|fuel_poverty|nhs|schools|epc|imd|neighbourhoods|debates|claimants|aps|ashe|bres|business|popest|police|elections|members|lsoa) SKIP="$SKIP --skip $s" ;; *) echo "ignoring '$s'" ;; esac
          done
          # Saved copies of slow sources are reused for a few days (whips/cache.py), except on the weekly full refresh.
          if [ "$FRESH_INPUT" = "true" ] || { [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; }; then
            echo "Full refresh: re-downloading every source"
          else
            export WHIPS_SOURCE_CACHE=.cache/sources
          fi
          python -m whips.build --out frontend/public/data $SKIP

      # One open issue lists the sources that failed to update; it is closed when they all work again.
      - name: Alert on failed sources
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Data sources failing to update"
          # Compare with the data on the live site (fetched above), to catch a source that "worked" but returned little.
          FAILED="$(python -m whips.report frontend/public/data/data.json previous.json)"
          OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$FAILED" ]; then
            BODY="$(printf 'Problems in the latest data refresh. The site is still published; the figures affected are missing or from an earlier run.\n\n%s\n\nRun: %s' "$FAILED" "$RUN_URL")"
            if [ -n "$OPEN" ]; then gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "All sources updated normally in the latest refresh: $RUN_URL"
          fi

      - name: Keep a copy of the data
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data-${{ github.run_number }}
          path: frontend/public/data
          retention-days: 30

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        env:
          # FOI research section (foi.html): the Supabase project URL and its public "anon" key, set as repository
          # variables (Settings > Secrets and variables > Actions > Variables). The anon key is designed to be public:
          # the database's row-level security decides who can read what. Without them the page says it isn't set up.
          # Read from repository variables, or from repository secrets of the same name if saved there instead.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning title=FOI research not connected::SUPABASE_URL and/or SUPABASE_ANON_KEY is missing (Settings > Secrets and variables > Actions, repository level, exact names). foi.html will say it isn't set up."
          fi
          case "$VITE_SUPABASE_URL" in ""|https://*.supabase.co|https://*.supabase.co/) ;; *) echo "::warning title=FOI research::SUPABASE_URL should look like https://<project>.supabase.co" ;; esac
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # If the refresh or the deploy fails outright, the site keeps its old data: raise an issue so it is noticed.
  alert:
    needs: [build, deploy]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Data refresh failed"
          BODY="The data refresh and deploy failed, so the live site is still showing older data. Run: $RUN_URL"
          OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$OPEN" ]; then gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
