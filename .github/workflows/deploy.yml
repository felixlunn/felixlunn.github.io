name: Refresh data & deploy

# Rebuilds every dataset from the live APIs and publishes the dashboard to
# GitHub Pages. Runs every two days, on every push to main, and on demand.
on:
  schedule:
    - cron: "17 3 */2 * *" # 03:17 UTC every other day
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip:
        description: "Optional sources to skip, space-separated (courts fuel_poverty nhs schools epc imd neighbourhoods debates claimants aps ashe bres business popest police elections members lsoa)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # Census 2021 never changes: keep fetched tables between runs (each run saves a fresh
      # copy; tables are refetched only when a metric needs categories the cache lacks).
      - name: Restore census cache
        uses: actions/cache@v4
        with:
          path: .cache/census
          key: census-v1-${{ github.run_id }}
          restore-keys: census-v1-

      - name: Fetch data and compute metrics
        env:
          WHIPS_CENSUS_CACHE: .cache/census
          NOMIS_UID: ${{ secrets.NOMIS_UID }} # optional Nomis API key (higher limits)
          EPC_TOKEN: ${{ secrets.EPC_TOKEN }} # EPC API bearer token (get-energy-performance-data.communities.gov.uk)
          SKIP_INPUT: ${{ github.event.inputs.skip }}
        run: |
          SKIP=""
          for s in $SKIP_INPUT; do
            case "$s" in courts|fuel_poverty|nhs|schools|epc|imd|neighbourhoods|debates|claimants|aps|ashe|bres|business|popest|police|elections|members|lsoa) SKIP="$SKIP --skip $s" ;; *) echo "ignoring '$s'" ;; esac
          done
          python -m whips.build --out frontend/public/data $SKIP

      - name: Keep a copy of the data
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data-${{ github.run_number }}
          path: frontend/public/data
          retention-days: 30

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
