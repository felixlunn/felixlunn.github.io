name: Refresh data

# Rebuilds every dataset from the live APIs, saves it as the "dashboard-data" artifact, then publishes the site with
# it (publish.yml). Runs daily, on demand, and when the pipeline code changes. Monday's run (and a manual run with
# "fresh" ticked) ignores saved copies and re-downloads every source. Site-only changes don't wait for this: they are
# published by publish.yml with the most recent data.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC every day
  push:
    branches: [main]
    paths: ["datadash/**", "pyproject.toml", ".github/workflows/refresh.yml"]
  workflow_dispatch:
    inputs:
      skip:
        description: "Optional sources to skip, space-separated (python -m datadash.build --help lists them)"
        required: false
        default: ""
      fresh:
        description: "Re-download every source, ignoring saved copies"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  issues: write # to raise an alert when the refresh or a data source fails

# One refresh at a time; a newer one waits rather than cancelling a refresh part-way through.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # Census 2021 never changes: keep fetched tables between runs (each run saves a fresh
      # copy; tables are refetched only when a metric needs categories the cache lacks).
      - name: Restore census cache
        uses: actions/cache@v6
        with:
          path: .cache/census
          key: census-v1-${{ github.run_id }}
          restore-keys: census-v1-

      # Slow sources that change rarely (police.uk, EPC, NHS, ...) are reused for a few days; see datadash/cache.py.
      - name: Restore saved sources
        uses: actions/cache@v6
        with:
          path: .cache/sources
          key: sources-v1-${{ github.run_id }}
          restore-keys: sources-v1-

      # The data now on the live site: used to tell how long each source's figures have gone unchanged, and the
      # FOI reference and policing priorities files to fall back on.
      - name: Fetch the published data
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          [ "${GITHUB_REPOSITORY#*/}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ] || SITE="$SITE/${GITHUB_REPOSITORY#*/}"
          curl -sfL --max-time 60 "$SITE/data/data.json" -o previous.json || rm -f previous.json
          # Keep the FOI reference files already live: the build overwrites them, so they survive only if its foi step fails.
          mkdir -p frontend/public/data/foi
          for f in reference.json areas.geojson police.json; do
            curl -sfL --max-time 120 "$SITE/data/foi/$f" -o "frontend/public/data/foi/$f" || rm -f "frontend/public/data/foi/$f"
          done
          # Likewise the policing priorities (rewritten by the build only when police.uk answers).
          curl -sfL --max-time 120 "$SITE/data/policing.json" -o frontend/public/data/policing.json || rm -f frontend/public/data/policing.json

      - name: Fetch data and compute metrics
        env:
          DATADASH_CENSUS_CACHE: .cache/census
          DATADASH_PREVIOUS_DATA: previous.json
          FRESH_INPUT: ${{ github.event.inputs.fresh }}
          NOMIS_UID: ${{ secrets.NOMIS_UID }} # optional Nomis API key (higher limits)
          EPC_TOKEN: ${{ secrets.EPC_TOKEN }} # EPC API bearer token (get-energy-performance-data.communities.gov.uk)
          SKIP_INPUT: ${{ github.event.inputs.skip }}
        run: |
          # Skip names come from datadash/registry.py; unknown ones are ignored with a note.
          KNOWN="$(python -m datadash.build --list-sources)"
          SKIP=""
          for s in $SKIP_INPUT; do
            if printf '%s\n' "$KNOWN" | grep -qxF "$s"; then SKIP="$SKIP --skip $s"; else echo "ignoring '$s'"; fi
          done
          # Saved copies of slow sources are reused for a few days (datadash/cache.py), except on the weekly full refresh.
          if [ "$FRESH_INPUT" = "true" ] || { [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; }; then
            echo "Full refresh: re-downloading every source"
          else
            export DATADASH_SOURCE_CACHE=.cache/sources
          fi
          python -m datadash.build --out frontend/public/data $SKIP

      # One open issue lists the sources that failed to update; it is closed when they all work again.
      - name: Alert on failed sources
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Data sources failing to update"
          # Compare with the data on the live site (fetched above), to catch a source that "worked" but returned little.
          FAILED="$(python -m datadash.report frontend/public/data/data.json previous.json)"
          OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$FAILED" ]; then
            BODY="$(printf 'Problems in the latest data refresh. The site is still published; the figures affected are missing or from an earlier run.\n\n%s\n\nRun: %s' "$FAILED" "$RUN_URL")"
            if [ -n "$OPEN" ]; then gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "All sources updated normally in the latest refresh: $RUN_URL"
          fi

      - name: Keep a copy of the data
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-data
          path: frontend/public/data
          retention-days: 30

  publish:
    needs: data
    uses: ./.github/workflows/publish.yml
    with:
      same_run: true
    secrets: inherit

  # If the refresh or the publish fails outright, the site keeps its old data: raise an issue so it is noticed.
  alert:
    needs: [data, publish]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Data refresh failed"
          BODY="The data refresh or publish failed, so the live site is still showing older data. Run: $RUN_URL"
          OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$OPEN" ]; then gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
